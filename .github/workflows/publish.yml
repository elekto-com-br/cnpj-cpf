name: Publish NuGet

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Everything that runs third-party code (NuGet packages with build targets and analyzers, the test
  # adapter) runs here, with no secret and no OIDC token. All it hands on is the packages.
  build:
    name: Build, Test & Pack
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned by commit, with the release in a comment; Dependabot proposes new ones
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # The package takes its version from the csproj, and the GitHub Release takes it from the tag.
      # Failing here, before anything is built, keeps the two equal.
      - name: Verify the csproj version matches the tag
        run: |
          CSPROJ=src/Elekto.BrazilianDocuments/Elekto.BrazilianDocuments.csproj
          CSPROJ_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$CSPROJ" | head -1)

          if [ -z "$CSPROJ_VERSION" ]; then
            echo "::error file=$CSPROJ::No <Version> element found."
            exit 1
          fi

          if [ "$CSPROJ_VERSION" != "$VERSION" ]; then
            echo "::error file=$CSPROJ::Tag ${GITHUB_REF_NAME} means version '${VERSION}', but the csproj declares '${CSPROJ_VERSION}'. Set them to the same value and re-tag."
            exit 1
          fi

          echo "Tag and csproj agree on ${VERSION}."

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x

      # From here on, the same steps as CI, so the package is built and checked as on every pull
      # request
      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

      - name: Pack
        run: dotnet pack src/Elekto.BrazilianDocuments/Elekto.BrazilianDocuments.csproj --no-build -c Release -o ./dist

      - name: Verify the package
        run: bash .github/scripts/verify-package.sh ./dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            dist/*.nupkg
            dist/*.snupkg
          if-no-files-found: error
          retention-days: 7

  # The only job that can publish to nuget.org. It checks out nothing and installs nothing: it takes
  # the packages from the build job, attests where they came from, and pushes them with the dotnet
  # already on the runner.
  publish:
    name: Publish to NuGet.org
    needs: build
    runs-on: ubuntu-latest
    # The Trusted Publishing policy on nuget.org names this environment, which only release tags may
    # deploy to, so that no other job can trade its OIDC token for an API key
    environment: nuget
    permissions:
      contents: read
      id-token: write       # the nuget.org login, and the signing certificate of the attestation
      attestations: write   # stores the attestation with the repository

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist

      # SLSA build provenance for both packages, which `gh attestation verify` checks. nuget.org adds
      # its own signature to the package it serves, so the copies to verify are the ones the GitHub
      # Release carries.
      - name: Attest the build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.nupkg
            dist/*.snupkg

      # Trusted Publishing: nuget.org trades this job's OIDC token for an API key that lasts an hour,
      # under the policy of the nuget.org user that the repository variable NUGET_USER names (the
      # user who created the policy, not the package owner). No long-lived key is stored anywhere,
      # so when the login fails, the job stops here and nothing is published.
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      # Pushing the .nupkg also pushes the .snupkg beside it to the symbol server, with the same key
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push dist/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  # Creates the GitHub Release for the tag once the packages are on nuget.org, with both attached:
  # they are the copies the attestation covers.
  github-release:
    name: Create the GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist

      # The notes are the package's own release notes (PackageReleaseNotes in the csproj), read from
      # the nuspec of the package just published
      - name: Write release notes
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PACKAGE=Elekto.BrazilianDocuments

          unzip -p "dist/${PACKAGE}.${VERSION}.nupkg" "${PACKAGE}.nuspec" > package.nuspec
          python3 -c '
          import sys, xml.etree.ElementTree as ET
          notes = ET.parse(sys.argv[1]).getroot().find(".//{*}releaseNotes")
          print(notes.text.strip() if notes is not None and notes.text else "")
          ' package.nuspec > notes.md

          {
            echo
            echo "Install or update: \`dotnet add package ${PACKAGE} --version ${VERSION}\`"
            echo
            echo "- NuGet: https://www.nuget.org/packages/${PACKAGE}/${VERSION}"
            echo "- Provenance of the packages attached here: \`gh attestation verify ${PACKAGE}.${VERSION}.nupkg --repo ${GITHUB_REPOSITORY}\`"
          } >> notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.nupkg dist/*.snupkg
          --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
